set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

unbind C-k
set -g prefix C-b
bind-key C-b send-prefix

set -g history-limit 50000

# Split panes — preserve current path
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Zoom pane toggle
bind-key m resize-pane -Z

# Coarse adjustment (5 or 10 cursor cells per bump)
bind -n C-Left resize-pane -L 10
bind -n C-Right resize-pane -R 10
bind -n C-Down resize-pane -D 5
bind -n C-Up resize-pane -U 5

bind c new-window -c "#{pane_current_path}"
set -g base-index 1
set -g renumber-windows on

# Fine adjustment (1 or 2 cursor cells per bump)
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

# pane switching
bind j select-pane -L
bind k select-pane -R
bind h select-pane -D
bind l select-pane -U

# Cycle panes (pane next / pane prev)
bind o select-pane -t :.+
bind O select-pane -t :.-

# Window navigation
bind n next-window
bind p previous-window

# Kill window with confirmation
bind X confirm-before -p "kill window #W? (y/n)" kill-window

# Rename window
bind , command-prompt -I "#{window_name}" "rename-window '%%'"

# Session / window tree overview (win list)
bind w choose-tree -Zs

# Session switcher (attach / session key)
bind S choose-session

# Copy Claude Code's last reply as clean plain text (reads session JSONL, no terminal rendering artifacts)
bind Y run-shell "~/scripts/claude-copy-last.py"

# Layout cycling (pan toggle)
bind Space next-layout

set -g mouse on
bind -n MouseDown1Pane select-pane -t= \; send-keys -M

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Theme switcher — prefix + T
bind T display-menu -T "Theme" \
  "tokyo-night" t "source-file ~/.tmux/themes/tokyo-night.conf ; run-shell 'echo tokyo-night > ~/.tmux/current-theme'" \
  "vague"        v "source-file ~/.tmux/themes/vague.conf ; run-shell 'echo vague > ~/.tmux/current-theme'" \
  "jellybeans"   j "source-file ~/.tmux/themes/jellybeans.conf ; run-shell 'echo jellybeans > ~/.tmux/current-theme'" \
  "minimal"      m "source-file ~/.tmux/themes/minimal.conf ; run-shell 'echo minimal > ~/.tmux/current-theme'"

# jump to cide window by name
bind i select-window -t :=checkout

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "~/scripts/smart-copy" # copy text with "y", auto-converts tables to HTML
bind-key -T copy-mode-vi 'o' send -X copy-pipe-and-cancel "~/.tmux/plugins/tmux-open-nvim/scripts/ton" # open file:line in existing nvim pane via ton (tmux-open-nvim)

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# Resize mode — press prefix + R, then h/j/k/l to resize, Enter or Escape to exit
bind R switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Enter switch-client -T root
bind -T resize Escape switch-client -T root

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'trevarj/tmux-open-nvim' # use ton command to open file in an open nvim pane
set -g @plugin 'tmux-plugins/tmux-urlview' # list urls using prefix + u
# set -g @plugin 'fabioluciano/tmux-tokyo-night'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Load saved theme or default to tokyo-night
#run-shell "[ -f ~/.tmux/current-theme ] && tmux source-file ~/.tmux/themes/$(cat ~/.tmux/current-theme).conf || tmux source-file ~/.tmux/themes/tokyo-night.conf"

# Window tab styles
set -g window-status-format '#[fg=#666666] #I:#W '
set -g window-status-current-format '#[bg=#5f87ff,fg=#000000,bold] #I:#W '
set -g window-status-current-style ''

set -g pane-border-lines heavy
set -g pane-active-border-style fg=blue
set -g pane-border-style fg=colour238
set -g window-style 'bg=#330000'
set -g window-active-style 'bg=#000033'
